name: Android-App bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Web-App bauen
        run: python3 tools/build_app.py
      - name: Android-Projekt erzeugen
        run: |
          npm install
          npx cap add android
          python3 tools/android_patch.py ${{ github.run_number }}
          npx cap sync android
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Wildlinge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Wildlinge-APK
          path: Wildlinge.apk
      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Wildlinge Android 1.${{ github.run_number }}
          make_latest: true
          body: |
            Android-App zum direkten Installieren. **Wildlinge.apk** antippen, herunterladen und öffnen.
            Updates einfach drüber installieren – Spielstände bleiben erhalten.
          files: Wildlinge.apk
