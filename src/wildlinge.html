<title>Wildlinge Moos-Edition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one handheld device centered on a dark moss ground; screen on top, controls below, key hints under it. */
:root{
  --ground:#141c17;
  --shell:#cdc6ad;
  --shell-shade:#a7a088;
  --bezel:#363b38;
  --moss:#4b7955;
  --moss-deep:#2c4f35;
  --berry:#b8475a;
  --berry-deep:#7e2b3b;
  --pad:#242727;
  --hint:#9db09f;
  --label:#5e5a4c;
  --pixel:'Fredoka', 'Nunito', system-ui, sans-serif;
  color-scheme:dark;
}
body{
  background:radial-gradient(120% 80% at 50% 0%,#1d2a22 0%,var(--ground) 60%) fixed,var(--ground);
  color:var(--hint);font-family:var(--pixel);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 28px;
  display:flex;flex-direction:column;align-items:center;gap:18px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.device{width:100%;max-width:420px;background:var(--shell);border-radius:14px 14px 60px 14px;padding:18px 18px 30px;box-shadow:inset -5px -7px 0 var(--shell-shade),inset 3px 3px 0 #ddd7c2,0 24px 48px rgba(0,0,0,.5)}
.bezel{background:var(--bezel);border-radius:10px 10px 34px 10px;padding:12px 18px 14px}
.bezel-top{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;color:#8e9590;letter-spacing:.1em;margin-bottom:9px}
.led{width:7px;height:7px;border-radius:50%;background:#e04b3f;box-shadow:0 0 7px #ff5c4d}
.bezel-top .line{flex:1;height:2px;background:linear-gradient(90deg,#b8475a,#e0a43a,#4b9a5a,#3a7ad0);opacity:.75}
canvas{display:block;width:100%;aspect-ratio:160/144;background:#fbf8ee;border-radius:2px}
.brand{margin:14px 4px 0;display:flex;align-items:baseline;gap:10px;color:var(--moss-deep)}
.brand b{font-size:19px;font-weight:700;letter-spacing:.04em}
.brand i{font-style:normal;font-size:11px;font-weight:600;color:var(--label);letter-spacing:.12em}
.controls{display:grid;grid-template-columns:1fr auto;align-items:center;margin-top:24px;touch-action:none}
.dpad{position:relative;width:114px;height:114px}
.dpad button{position:absolute;width:38px;height:38px;background:var(--pad);border:none;padding:0;cursor:pointer;box-shadow:0 3px 0 #0d0f0f}
.dpad .up{left:38px;top:0;border-radius:4px 4px 0 0}
.dpad .down{left:38px;top:76px;border-radius:0 0 4px 4px}
.dpad .left{left:0;top:38px;border-radius:4px 0 0 4px}
.dpad .right{left:76px;top:38px;border-radius:0 4px 4px 0}
.dpad .hub{position:absolute;left:38px;top:38px;width:38px;height:38px;background:var(--pad)}
.dpad .hub::after{content:"";position:absolute;inset:12px;border-radius:50%;background:#1a1c1c}
.dpad button::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;border:6px solid transparent;transform:translate(-50%,-50%)}
.dpad .up::after{border-bottom-color:#3d4241;margin-top:-3px}
.dpad .down::after{border-top-color:#3d4241;margin-top:3px}
.dpad .left::after{border-right-color:#3d4241;margin-left:-3px}
.dpad .right::after{border-left-color:#3d4241;margin-left:3px}
.ab{display:flex;gap:16px;transform:rotate(-24deg);padding-right:4px}
.ab .btn{display:flex;flex-direction:column;align-items:center;gap:8px}
.ab .btn:first-child{margin-top:30px}
.ab button{width:54px;height:54px;border-radius:50%;border:none;background:var(--berry);cursor:pointer;box-shadow:0 4px 0 var(--berry-deep),inset 3px 3px 0 rgba(255,255,255,.18)}
.ab span,.meta span{font-size:12px;font-weight:600;color:var(--label);letter-spacing:.1em}
.meta{grid-column:1/-1;display:flex;justify-content:center;gap:24px;margin-top:26px}
.meta .btn{display:flex;flex-direction:column;align-items:center;gap:8px}
.meta button{width:58px;height:14px;border-radius:8px;border:none;background:#8a8573;transform:rotate(-24deg);cursor:pointer;box-shadow:0 2px 0 #6a6657}
button.on,button:active{transform:translateY(2px);box-shadow:none}
.meta button.on,.meta button:active{transform:rotate(-24deg) translateY(2px)}
button:focus-visible{outline:2px solid #f2f6ee;outline-offset:2px}
.hint{max-width:420px;font-size:13px;line-height:1.9;text-align:center;color:var(--hint)}
.hint kbd{font-family:var(--pixel);font-size:12px;background:#222c25;border:1px solid #33433a;border-radius:3px;padding:2px 5px;color:#cfe3c9}
.saves{width:100%;max-width:420px;background:#1c2620;border:1px solid #2e3d33;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.saves-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.saves-head b{font-size:14px;font-weight:700;color:#e6efe2;letter-spacing:.08em}
#cloudState{font-family:system-ui,sans-serif;font-size:12px;color:#9db09f}
#cloudState[data-on="1"]{color:#8fd0ff}
.saves-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.saves button.pill{font-family:var(--pixel);font-size:13px;font-weight:600;line-height:1.6;letter-spacing:.04em;color:#f3f7f0;background:#2f4a3a;border:1px solid #476b55;border-radius:8px;padding:9px 8px;cursor:pointer;box-shadow:0 2px 0 #18241d}
.saves button.pill:hover{background:#3a5a47}
.saves button.pill.alt{background:#5a2f3a;border-color:#7e4553}
.saves button.pill.alt:hover{background:#6c3946}
#codeBox{width:100%;min-height:64px;resize:vertical;font-family:ui-monospace,monospace;font-size:11px;color:#dfe9db;background:#121a15;border:1px solid #33433a;border-radius:8px;padding:8px;box-sizing:border-box;word-break:break-all}
#saveMsg{font-family:system-ui,sans-serif;font-size:12px;color:#ffe09a;min-height:1em;margin:0}
@media (max-width:380px){.dpad{transform:scale(.88);transform-origin:left center}.ab button{width:48px;height:48px}}
</style>

<div class="device">
  <div class="bezel">
    <div class="bezel-top"><span class="led"></span><span class="line"></span><span>WILDLINGE · COLOR</span></div>
    <canvas id="screen" width="960" height="864" aria-label="Spielbildschirm"></canvas>
  </div>
  <div class="brand"><b>WILDLINGE</b><i>MOOS-EDITION</i></div>
  <div class="controls">
    <div class="dpad">
      <button class="up" data-btn="up" aria-label="Hoch"></button>
      <button class="left" data-btn="left" aria-label="Links"></button>
      <div class="hub"></div>
      <button class="right" data-btn="right" aria-label="Rechts"></button>
      <button class="down" data-btn="down" aria-label="Runter"></button>
    </div>
    <div class="ab">
      <div class="btn"><button data-btn="b" aria-label="B"></button><span>B</span></div>
      <div class="btn"><button data-btn="a" aria-label="A"></button><span>A</span></div>
    </div>
    <div class="meta">
      <div class="btn"><button data-btn="select" aria-label="Ton an oder aus"></button><span>TON</span></div>
      <div class="btn"><button data-btn="start" aria-label="Start"></button><span>START</span></div>
    </div>
  </div>
</div>
<section class="saves" aria-label="Spielstand">
  <div class="saves-head"><b>SPIELSTAND</b><span id="cloudState">3 Slots in diesem Browser · Code für andere Geräte</span></div>
  <div class="saves-row"><button class="pill" id="btnExport">Als Datei sichern</button><button class="pill" id="btnImport">Datei laden</button></div>
  <div class="saves-row"><button class="pill alt" id="btnCopy">Code kopieren</button><button class="pill alt" id="btnPaste">Code einfügen</button></div>
  <textarea id="codeBox" hidden spellcheck="false" aria-label="Spielstand-Code"></textarea>
  <button class="pill" id="btnCodeLoad" hidden>Code laden</button>
  <p id="saveMsg" role="status"></p>
  <input type="file" id="fileIn" accept=".json,.txt,application/json,text/plain" hidden>
</section>
<p class="hint"><kbd>Pfeile</kbd>/<kbd>WASD</kbd> laufen · <kbd>Z</kbd>/<kbd>Leer</kbd> = A · <kbd>X</kbd> = B · <kbd>Enter</kbd> = START<br>B halten = rennen · A halten = schneller Text · Bildschirm antippen = hinlaufen<br>3 Spielstand-Slots im Menü unter SPEICHERN.</p>

<script>
(()=>{
const S=6,W=160,H=144;
const FONT="'Press Start 2P', ui-monospace, monospace";
const cv=document.getElementById('screen');cv.width=W*S;cv.height=H*S;
const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const KEY='wildlinge-moos-save-v2';

/* ================= FARBEN ================= */
const INK='#232a33',SUB='#6b7380',PAPER='#fbf8ee',SEL='#ffe9a8',OUTL='#2a2430',SKIN='#f6c9a0';
const TYPE_COL={Normal:'#a8a07a',Feuer:'#f0803a',Wasser:'#5a8ef0',Pflanze:'#5cb844',Elektro:'#eebc12',Stein:'#a8925a',Flug:'#8f84ec'};
TYPE_COL.Kampf='#c8583a';TYPE_COL.Psycho='#e8589a';TYPE_COL.Gift='#9a4ac8';TYPE_COL.Eis='#5ac4e2';TYPE_COL.Geist='#7a5aa8';TYPE_COL['Käfer']='#92ac22';TYPE_COL.Typlos='#888888';
const pcache={};
function rgb(h){if(pcache[h])return pcache[h];const n=parseInt(h.slice(1),16);return pcache[h]=[n>>16,n>>8&255,n&255];}
const hex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
function shade(h,f){const[r,g,b]=rgb(h);if(f<1)return hex([r*f,g*f,b*f]);const t=f-1;return hex([r+(255-r)*t,g+(255-g)*t,b+(255-b)*t]);}
function mix(a,b,t){const A=rgb(a),B=rgb(b);return hex([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t]);}

const REG={
meadow:{sky:['#7cc4f0','#d2f0fb'],hill:'#78c49a',grass:['#b4e48a','#8fd06a','#5fa846'],tall:['#58b84c','#348a3a','#21612c','#a8ea80'],path:['#efdcaa','#d9c08a','#b89c64'],water:['#bdeeff','#5ab4ea','#2f7ec4'],leaf:['#86d65e','#45a040','#276b2e'],trunk:['#8a5a32','#5a3a1e'],roof:['#ee6a52','#b8402f','#ffa088'],wall:['#fbf3df','#dccbaa'],win:['#8fd8f4','#e8faff'],sand:['#f6e6b6','#e2cb8e'],rock:['#c4bcae','#948b7c','#5f584d'],flower:['#ff6f8e','#ffd84d','#ffffff','#9b7bff'],frame:'#4f9a5a'},
stone:{sky:['#98bcd8','#e2ecf3'],hill:'#93a29a',grass:['#c8d8a0','#a5ba7a','#7a8f58'],tall:['#7f9e52','#5a7a3a','#3e5a2a','#bcd47e'],path:['#e6decd','#cbc0a8','#a49a82'],water:['#c8e8f6','#6aaed4','#3a78a8'],leaf:['#8eb462','#5e8a42','#3c602c'],trunk:['#7a5a3a','#4e3a24'],roof:['#7f90aa','#4f5f78','#b4c2d8'],wall:['#f0ece2','#cfc8b8'],win:['#a8d8ea','#e8f6fc'],sand:['#eee2c0','#d6c49a'],rock:['#bdb6a8','#8c8474','#5a5448'],flower:['#e88a5a','#f2d46a','#ffffff','#b08ad8'],frame:'#6c7c8c'},
sea:{sky:['#5abcf6','#c8f0ff'],hill:'#5ab4c4',grass:['#ace6a2','#80cc84','#58a866'],tall:['#4ab47c','#2f8a5e','#1e6446','#94e4aa'],path:['#f4e6c0','#e0cc9a','#c0a874'],water:['#c8f4ff','#48aee8','#1e6eb8'],leaf:['#70d27c','#3c9e5c','#226a3e'],trunk:['#8a6040','#5a3e28'],roof:['#4a8ee0','#2c5ea8','#8ec4ff'],wall:['#fdfbf2','#dcd4bc'],win:['#9ae0ff','#eafaff'],sand:['#fbecc0','#ead09a'],rock:['#c0c4c0','#8e9490','#5c625e'],flower:['#ff8aa0','#ffe070','#ffffff','#6ad0ff'],frame:'#3a84c8'},
spark:{sky:['#f0b85a','#fdeec4'],hill:'#c8a858',grass:['#dee08a','#c2c262','#949640'],tall:['#adb444','#7f8a2c','#5a641e','#eaea8c'],path:['#f2deaa','#d8c088','#b49a60'],water:['#ccf0f4','#5ab8d0','#2e80a0'],leaf:['#acc852','#7a9a36','#4e6c24'],trunk:['#8a5e30','#5a3c1c'],roof:['#f0a040','#c06a1e','#ffd490'],wall:['#fff8e4','#e4d4ac'],win:['#ffe880','#fff8d0'],sand:['#f8e8b4','#e6d08a'],rock:['#c8bca4','#9a8c74','#6a5e4a'],flower:['#ffd23a','#ff9a3a','#ffffff','#ff6a6a'],frame:'#c88a2a',amb:'spark'},
bloom:{sky:['#f2a8c8','#fdeaf2'],hill:'#c89ac8',grass:['#c8eea2','#a2d880','#78b460'],tall:['#7ec46e','#58a050','#3c7a3c','#c4f2a4'],path:['#f6e4d4','#e4c8b4','#c4a48e'],water:['#dcf2ff','#78bcef','#4a8ad0'],leaf:['#90d470','#5aa84e','#3a7a3a'],trunk:['#8a5a4a','#5a3a30'],roof:['#f07aa8','#c04a7a','#ffb4d0'],wall:['#fff6f6','#ead2d6'],win:['#c8e8ff','#f2faff'],sand:['#faeace','#e8d0ac'],rock:['#ccc0c4','#9c8e94','#6a5c64'],flower:['#ff6aa8','#ffd84d','#ffffff','#b07aff'],frame:'#cc5a8a',amb:'petal'},
ember:{sky:['#d8604a','#f8c090'],hill:'#7a4438',grass:['#bca474','#988058','#6e5a3e'],tall:['#8e7e3e','#6a5a2a','#4a3e1e','#c8b260'],path:['#dabb9a','#bc9a78','#946e52'],water:['#ffe882','#ff8a2a','#c8381c'],leaf:['#c48e3e','#946628','#64421a'],trunk:['#5a3a26','#3a2416'],roof:['#b23e30','#6e2018','#e8806a'],wall:['#f2e2d2','#ccb49c'],win:['#ffb060','#ffe0b0'],sand:['#e6caa4','#c8a880'],rock:['#8a7a74','#625650','#3e3430'],flower:['#ff7a3a','#ffd23a','#ffe8c0','#ff4a4a'],frame:'#c04a34',amb:'ember'}
};
const ARENA_THEME=[
 {base:'stone',floor:['#e0d8c8','#cfc6b4'],iwall:['#7a7064','#4e463e','#9a9084'],decor:'rock'},
 {base:'sea',floor:['#d8f0fa','#c4e4f2'],iwall:['#3e72a0','#264c6c','#5e94bc'],decor:'pool'},
 {base:'spark',floor:['#f0ecde','#dedac8'],iwall:['#5e5e6c','#3a3a46','#80808e'],decor:'coil'},
 {base:'bloom',floor:['#dff4cc','#cce8b6'],iwall:['#5e8e4e','#3a6030','#80ae68'],decor:'bush'},
 {base:'ember',floor:['#ecd2b6','#dcbea0'],iwall:['#62302a','#3a1a16','#844438'],decor:'lava'}];
ARENA_THEME.forEach((t,i)=>{REG['arena'+i]=Object.assign({},REG[t.base],t,{amb:null,accent:TYPE_COL[['Stein','Wasser','Elektro','Pflanze','Feuer'][i]]});});
for(const k in REG){const r=REG[k];r.frameL=shade(r.frame,1.45);r.frameD=shade(r.frame,.6);}
REG.frost={sky:['#9ad0f4','#eaf6ff'],hill:'#c4dcee',grass:['#f0f6fa','#d6e6f0','#aec6d8'],tall:['#cfe2ec','#a4c2d4','#7a9eb6','#ffffff'],path:['#dde8f0','#c4d2de','#a2b4c6'],water:['#e6f8ff','#a4dcf2','#62aed2'],leaf:['#7aa8b0','#4a7a84','#2a4e58'],trunk:['#6a5040','#45342a'],roof:['#5a7ab0','#3a5a8a','#8aa8d8'],wall:['#f4f6fa','#d0d8e2'],win:['#a8e0ff','#ecfaff'],sand:['#ffffff','#e2eef8'],rock:['#ccdbe6','#9aacbe','#667c90'],flower:['#a8e0ff','#ffffff','#d0c0ff','#80c8ff'],frame:'#5a9ccc',amb:'snow'};
REG.spuk={sky:['#2a1e4a','#6a4a7a'],hill:'#3e2e4e',grass:['#6a7a5e','#505e46','#36422e'],tall:['#4e5e40','#36442c','#222c1e','#7e8e60'],path:['#8e7e6e','#706050','#504438'],water:['#5a6a8a','#3a4a6a','#22304a'],leaf:['#4e4e60','#363644','#20202a'],trunk:['#3a2e2a','#22191a'],roof:['#5a3a6a','#3a2448','#7a5a8a'],wall:['#c8c0d0','#a098b0'],win:['#a8ff9a','#e0ffd8'],sand:['#c8c0b0','#a8a090'],rock:['#7a7480','#58525e','#38343e'],flower:['#b07aff','#7affc8','#ffffff','#ff7ab0'],frame:'#7a5aa8',amb:null};
REG.indoor=Object.assign({},REG.meadow,{floor:['#e2c290','#d2b07c'],iwall:['#f2e8d2','#c8b494','#fff8e8'],decor:'rock',accent:'#e8483a',amb:null,frame:'#b07a4a'});
REG.liga=Object.assign({},REG.stone,{floor:['#e8e2f2','#d6cee6'],iwall:['#4a3a6a','#2e2448','#6a5a8e'],decor:'rock',accent:'#e8b830',amb:null,frame:'#8a6ac0'});
for(const k of['frost','spuk','indoor','liga']){const r=REG[k];r.frameL=shade(r.frame,1.45);r.frameD=shade(r.frame,.6);}
let REGK='meadow',R=REG.meadow;
const setReg=k=>{REGK=k;R=REG[k];};
let timeMode='auto';try{timeMode=localStorage.getItem('wildlinge-zeit')||'auto';}catch(e){}
function dayPhase(){if(timeMode!=='auto')return timeMode;const h=new Date().getHours();return h>=6&&h<17?'tag':h>=17&&h<20?'abend':'nacht';}

/* ================= GRUNDLAGEN ================= */
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w*S;c.height=h*S;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.setTransform(S,0,0,S,0,0);fn(g);return c;}
function px(g,col,x,y,w=1,h=1){g.fillStyle=col;g.fillRect(x,y,w,h);}
function ellipse(g,col,cx,cy,rx,ry){if(rx<=0)return;g.beginPath();g.ellipse(cx,cy+.5,rx,Math.max(.5,ry+.5),0,0,Math.PI*2);g.fillStyle=col;g.fill();}
function vgrad(g,x,y,w,h,a,b){g.fillStyle=lgrad(g,0,y,0,y+h,[[0,a],[1,b]]);g.fillRect(x,y,w,h);}

/* ================= TON ================= */
let AC=null,MG=null,NB=null,soundOn=true;
try{soundOn=localStorage.getItem('wildlinge-sound')!=='0';}catch(e){}
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.12;MG.connect(AC.destination);}catch(e){AC=null;}}
function note(f,t,d,type='square',v=.3,mus){if(!AC||!soundOn)return;{const vm=mus?MUSV:SFXV;v*=(vm==null||isNaN(vm))?1:vm;if(v<=0)return;}const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.setValueAtTime(v,t+d*.7);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.03);}
function noise(t,d,v=.3){if(!AC||!soundOn)return;v*=(SFXV==null||isNaN(SFXV))?1:SFXV;if(v<=0)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
 const s=AC.createBufferSource();s.buffer=NB;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(g);g.connect(MG);s.start(t);s.stop(t+d);}
function nn(s){const m=s.match(/^([A-G])(#?)(\d)$/);const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);return 440*Math.pow(2,(12*(+m[3]+1)+b-69)/12);}
function sfx(k){if(!AC||!soundOn)return;const t=AC.currentTime+.01;
 if(k==='blip')note(1320,t,.03,'square',.12);
 else if(k==='ok'){note(880,t,.04,'square',.18);note(1320,t+.04,.06,'square',.18);}
 else if(k==='hit'){noise(t,.18,.5);note(110,t,.12,'square',.25);}
 else if(k==='super'){noise(t,.25,.6);note(90,t,.18,'square',.3);note(70,t+.08,.18,'square',.3);}
 else if(k==='faint'){for(let i=0;i<7;i++)note(620-i*80,t+i*.06,.06,'square',.2);}
 else if(k==='lvl')['C5','E5','G5','C6'].forEach((n,i)=>note(nn(n),t+i*.08,.09,'square',.25));

async function bagMenu(inBattle){
 while(true){
  const keys=ITEM_ORDER.filter(k=>G.inv[k]>0||['ball','potion'].includes(k));const items=[...keys.map(k=>()=>ITEMS[k].n+'\tx'+(G.inv[k]||0)),'ZURÜCK'];

  if(it.kind==='held'){await msg(ITEMS[k].d);await msg('Gib es im Team-Menü unter ITEM einem Wildling zum Tragen.');continue;}

  if((it.kind==='candy'||it.kind==='feed')&&inBattle){await msg('Das geht nur außerhalb von Kämpfen.');continue;}
  const t=await teamScreen({title:'Wem geben?'});if(t<0)continue;const m=G.team[t],mx=stats(m).hp;fixMon(m);

  if(it.kind==='heal'&&m.hp>=mx){await msg('Die KP sind schon voll.');continue;}
  if(it.kind==='cure'&&!m.status){await msg(mName(m)+' ist gesund.');continue;}
  if(it.kind==='ether'&&m.pp.every((p,j)=>p>=ppMax(m.moves[j]))){await msg('Die AP sind schon voll.');continue;}
  if(it.kind==='candy'&&m.lvl>=100){await msg(mName(m)+' hat schon das Höchstlevel.');continue;}
  if(inBattle)return{t:'item',k,i:t};
  G.inv[k]--;await applyItem(k,m);

 }

 const A=stats(a.mon).atk*stageMul(a.st.atk)*(a.mon.status==='BRT'?.5:1),Df=stats(d.mon).def*stageMul(d.st.def);
 const base=Math.floor(Math.floor((2*a.mon.lvl/5+2)*M.p*A/Df)/50)+2;
 const e=M.t==='Typlos'?1:effK(M.t,d.mon.sp),crit=Math.random()<1/16;
 let mul=(a.mon.held==='kraftband'?1.2:1)*(typesOf(a.mon.sp).includes(M.t)?1.5:1)*e*(crit?1.5:1)*(.85+Math.random()*.15);
 const aa=abOf(a.mon);if(aa.boost===M.t&&a.mon.hp<=stats(a.mon).hp/3)mul*=1.5;
 if(SP[d.mon.sp].ab==='dickfell')mul*=.8;

 if(B.weather==='snow'&&M.t==='Eis')mul*=1.2;
 if(B.double)mul*=.9;
 return{dmg:Math.max(1,Math.floor(base*mul)),e,crit};}

async function turnSingle(){
 const me=B.me[0],en=B.en[0];
 const act=await battleMenu(me);
 if(act.t==='run'){if(B.trainer){await msg('Vor einem Trainerkampf kannst du nicht fliehen!');return null;}
  if(spdOf(me)>=spdOf(en)||Math.random()<.5){sfx('door');await msg('Du bist entkommen!');return'run';}
  await msg('Flucht misslungen!');return enemyOnly();}
 if(act.t==='ball'){if(B.trainer){await msg('Fremde Wildlinge darfst du nicht fangen!');return null;}if(await throwBall(act.k))return'caught';return enemyOnly();}
 if(act.t==='item'){G.inv[act.k]--;await applyItem(act.k,G.team[act.i]);return enemyOnly();}
 if(act.t==='switch'){await msg('Komm zurück, '+SP[me.mon.sp].name+'!');await tween(10,p=>me.scale=1-p);me.show=false;me.mon=G.team[act.i];await msg('Los, '+SP[me.mon.sp].name+'!');await sendOut(me);return enemyOnly();}
 const em=pickEnemyMove(en),ms=spdOf(me),es=spdOf(en),pm=(MV[act.m]&&MV[act.m].pri)||0,pe=(MV[em]&&MV[em].pri)||0,meFirst=pm!==pe?pm>pe:(ms>es||(ms===es&&Math.random()<.5));
 for(const[w,k,t]of meFirst?[[me,act.m,en],[en,em,me]]:[[en,em,me],[me,act.m,en]]){await doMove(w,k,t);const r=await checkFaints();if(r!==undefined)return r;}
 return endTurn();
}
async function enemyOnly(){const en=B.en[0];await doMove(en,pickEnemyMove(en),B.me[0]);const r=await checkFaints();if(r!==undefined)return r;return endTurn();}
async function turnDouble(){
 const acts=[];
 for(const w of B.me){if(!alive(w))continue;const a=w.ally?allyAct(w):await battleMenu(w);
  if(a.t==='item'){acts.push({w,item:a,pri:5});continue;}
  if(a.t==='run'){await msg('Vor einem Trainerkampf kannst du nicht fliehen!');return null;}
  acts.push({w,k:a.m,t:a.target,pri:(MV[a.m]&&MV[a.m].pri)||0});}
 for(const w of B.en){if(!alive(w))continue;const k=pickEnemyMove(w),M=MV[k];acts.push({w,k,t:(M.fx&&M.fx[0]==='self')?w:pick(B.me.filter(alive)),pri:M.pri||0});}
 acts.sort((x,y)=>(y.pri||0)-(x.pri||0)||spdOf(y.w)-spdOf(x.w)||Math.random()-.5);
 for(const A of acts){if(!alive(A.w))continue;
  if(A.item){G.inv[A.item.k]--;await applyItem(A.item.k,G.team[A.item.i]);}
  else await doMove(A.w,A.k,A.t);
  const r=await checkFaints();if(r==='win'||r==='lose')return r;}
 return endTurn();
}
async function endTurn(){
 for(const w of[...B.me,...B.en]){if(!alive(w)||!w.show)continue;const s=w.mon.status;
  if(SP[w.mon.sp].ab==='regenkoerper'&&B.weather==='rain'&&w.mon.hp<stats(w.mon).hp){const h=Math.max(1,Math.floor(stats(w.mon).hp/16));w.mon.hp=Math.min(stats(w.mon).hp,w.mon.hp+h);await animHp(w);await msg(nm(w)+' tankt Kraft im Regen.');}
  if(s==='BRT'||s==='GIF'){const d=Math.max(1,Math.floor(stats(w.mon).hp/(s==='BRT'?16:8)));
   await msg(nm(w)+(s==='BRT'?' leidet unter der Verbrennung!':' leidet unter dem Gift!'));
   const p=posOf(w);for(let i=0;i<10;i++)addP({x:p.x-10+Math.random()*20,y:p.y+8,vy:-1-Math.random(),life:18,col:s==='BRT'?pick(['#ffd23a','#ff8a2a']):pick(['#b04ad8','#d88aff'])});
   w.mon.hp=Math.max(0,w.mon.hp-d);await animHp(w);const r=await checkFaints();if(r==='win'||r==='lose')return r;}}
 return null;
}

const easeO=q=>1-(1-q)*(1-q);
function boltPts(x,y0,y1){const pts=[];let x2=x,y=y0;while(y<y1){pts.push([x2,y]);x2+=rnd(-6,6);y+=rnd(4,8);}pts.push([x2,y1]);return pts;}
function drawP(arr,ox=0,oy=0){for(const p of arr){const x=p.x-ox,y=p.y-oy,l0=p.l0||30,q=1-p.life/l0,k=p.k;
 ctx.globalAlpha=Math.max(0,Math.min(1,p.life/Math.max(1,Math.min(10,l0*.45))));
 if(!k){ctx.beginPath();ctx.arc(x+p.s/2,y+p.s/2,p.s*.62+.15,0,TAU);ctx.fillStyle=p.col;ctx.fill();}
 else if(k==='glow'){ctx.globalCompositeOperation='lighter';const r=p.s*3,gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'#ffffff');gr.addColorStop(.25,p.col);gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,r*2,r*2);}
 else if(k==='spark'){ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineWidth=p.s*.55;ctx.strokeStyle=p.col;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-p.vx*3.2,y-p.vy*3.2);ctx.stroke();ctx.lineWidth=p.s*.22;ctx.strokeStyle='#ffffff';ctx.stroke();}
 else if(k==='ring'){const r=p.r0+(p.r1-p.r0)*easeO(q);ctx.globalAlpha*=1-q*.7;ctx.lineWidth=p.w*(1-q*.6);ctx.strokeStyle=p.col;ctx.beginPath();ctx.ellipse(x,y,r,r*p.flat,0,0,TAU);ctx.stroke();}
 else if(k==='impact'){const r=p.sz*(.45+easeO(q)*.75);ctx.globalAlpha=1-q;ctx.beginPath();for(let i=0;i<16;i++){const a=i/16*TAU+.2,rr=i%2?r*.42:r*(i%4?1:1.25);ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr*.85);}ctx.closePath();ctx.fillStyle=p.col;ctx.fill();
  ctx.beginPath();for(let i=0;i<16;i++){const a=i/16*TAU+.2,rr=(i%2?r*.42:r*.8)*.6;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr*.85);}ctx.closePath();ctx.fillStyle='#ffffff';ctx.fill();}
 else if(k==='star'){const s=p.s*1.7,r=p.rot||0;ctx.globalCompositeOperation='lighter';ctx.beginPath();for(let i=0;i<8;i++){const a=r+i/8*TAU,rr=i%2?s*.3:s;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fillStyle=p.col;ctx.fill();}
 else if(k==='leaf'){ctx.save();ctx.translate(x,y);ctx.rotate(p.rot||0);ctx.beginPath();ctx.ellipse(0,0,p.s*1.6,p.s*.7,0,0,TAU);ctx.fillStyle=p.col;ctx.fill();ctx.lineWidth=.3;ctx.strokeStyle=shade(p.col,.6);ctx.stroke();ctx.beginPath();ctx.moveTo(-p.s*1.4,0);ctx.lineTo(p.s*1.4,0);ctx.stroke();ctx.restore();}
 else if(k==='shard'){ctx.save();ctx.translate(x,y);ctx.rotate(p.rot||0);const s=p.s*1.5;ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.6,s*.5);ctx.lineTo(-s*.5,s*.6);ctx.closePath();ctx.fillStyle=p.col;ctx.fill();ctx.lineWidth=.3;ctx.strokeStyle=shade(p.col,.55);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.2,0);ctx.lineTo(-s*.2,0);ctx.fill();ctx.restore();}
 else if(k==='bubble'){ctx.lineWidth=.45;ctx.strokeStyle=p.col;ctx.beginPath();ctx.arc(x,y,p.s,0,TAU);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.25)';ctx.fill();ctx.beginPath();ctx.arc(x-p.s*.35,y-p.s*.35,p.s*.25,0,TAU);ctx.fillStyle='#ffffff';ctx.fill();}
 else if(k==='smoke'){const r=p.s*(1+q*2.4);ctx.globalAlpha*=.4*(1-q);ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=p.col;ctx.fill();}
 else if(k==='bolt'){ctx.globalCompositeOperation='lighter';ctx.lineJoin='round';ctx.lineCap='round';const pts=p.pts;ctx.beginPath();pts.forEach(([a,b],i)=>i?ctx.lineTo(a-ox,b-oy):ctx.moveTo(a-ox,b-oy));ctx.lineWidth=2.6;ctx.strokeStyle=p.col;ctx.stroke();ctx.lineWidth=.9;ctx.strokeStyle='#ffffff';ctx.stroke();}
 else if(k==='slash'){const r=p.r,a0=p.a0,a1=a0+(p.a1-a0)*Math.min(1,q*2.2);ctx.lineCap='round';ctx.lineWidth=2.2*(1-q);ctx.strokeStyle=p.col;ctx.beginPath();ctx.ellipse(x,y,r,r*.6,p.rot||0,a0,a1);ctx.stroke();ctx.lineWidth=.8*(1-q);ctx.strokeStyle='#ffffff';ctx.stroke();}
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}}

 if(k!=='verzweifler'){fixMon(a.mon);const i=a.mon.moves.indexOf(k);if(i>=0)a.mon.pp[i]=Math.max(0,a.mon.pp[i]-1);}
 await msg(nm(a)+' setzt '+M.n+' ein!');
 const selfT=M.fx&&M.fx[0]==='self';

 await animAttack(a,M);
 if(!selfT){const ev=abOf(d.mon).evade&&Math.random()<.1,acc=SP[a.mon.sp].ab==='adlerauge'?999:M.a;
  if(ev||Math.random()*100>=acc){await msg(ev?nm(d)+' ist geschickt ausgewichen!':'Die Attacke ging daneben!');return;}}
 await moveFx(M,posOf(a),posOf(tgt));
 if(M.p===0){
  if(M.inflict){if(d.mon.status){await msg('Es hat keine Wirkung...');return;}await inflict(d,M.inflict);if(!d.mon.status)await msg('Es hat keine Wirkung...');return;}

 let dm=r.dmg,rob=false;if(SP[d.mon.sp].ab==='robust'&&d.mon.hp===stats(d.mon).hp&&dm>=d.mon.hp){dm=d.mon.hp-1;rob=true;}

 await hit(d,dm,r.e>1||r.crit,r.crit);
 if(rob)await msg(nm(d)+' hält dank Robust durch!');
 if(r.crit)await msg('Ein Volltreffer!');
 if(r.e>1)await msg('Das ist sehr effektiv!');else if(r.e<1)await msg('Das ist nicht sehr effektiv...');
 if(M.recoil&&alive(a)){await msg(nm(a)+' wird vom Rückstoß getroffen!');await hit(a,Math.max(1,Math.floor(stats(a.mon).hp/4)),false,false);}
 if(M.st&&alive(d)&&!d.mon.status&&Math.random()<M.st[1])await inflict(d,M.st[0]);

}

function findPath(tx,ty){const W2=MAPC.w,H2=MAPC.h,start=pl.x+','+pl.y,prev={},q=[[pl.x,pl.y]];prev[start]=null;

 while(q.length){const[x,y]=q.shift();if((!goalAdj&&x===tx&&y===ty)||(goalAdj&&Math.abs(x-tx)+Math.abs(y-ty)===1)){
   const path=[];let k=x+','+y;while(prev[k]){path.unshift(prev[k][1]);k=prev[k][0];}
   if(goalAdj){const dir=tx>x?'right':tx<x?'left':ty>y?'down':'up';const t=tileAt(tx,ty);if('CAMLHG'.includes(t))path.push(dir);else{path.push('face:'+dir);path.push('act');}}
   return path;}
  for(const[d,[dx,dy]]of Object.entries(DIRS)){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(nx<0||ny<0||nx>=W2||ny>=H2||k in prev)continue;if(blocked(nx,ny))continue;prev[k]=[x+','+y,d];q.push([nx,ny]);}}
 return null;}

 if(M.fx){const[w,s,n]=M.fx;return(w==='self'?'Erhöht eigene ':'Senkt ')+SN[s]+(w==='self'?'':' des Gegners')+(Math.abs(n)>1?' stark':'')+'.';}
 if(M.inflict)return({SLF:'Schläfert den Gegner ein.',GIF:'Vergiftet den Gegner.',PAR:'Paralysiert den Gegner.',BRT:'Verbrennt den Gegner.'}[M.inflict]);
 if(M.conf)return'Verwirrt den Gegner.';if(M.recoil)return'Trifft auch dich selbst.';
 if(M.st)return Math.round(M.st[1]*100)+' % Chance auf '+STN[M.st[0]]+'.';return'Kein Zusatzeffekt.';}

async function learnNew(m,k){
 fixMon(m);const n=mName(m),M=MV[k];if(m.moves.includes(k))return;
 if(m.moves.length<4){m.moves.push(k);m.pp.push(ppMax(k));sfx('ok');await msg(n+' lernt '+M.n+'!');return;}
 await msg(n+' möchte '+M.n+' lernen. Es kennt aber schon vier Attacken.');
 while(true){const i=await learnScreen(m,k);
  if(i<4){const old=MV[m.moves[i]].n;await msg(old+' vergessen und '+M.n+' lernen?');if(!await yesNo())continue;
   m.moves[i]=k;m.pp[i]=ppMax(k);sfx('ok');await msg('1, 2 und... Schwupp! '+n+' vergisst '+old+' und lernt '+M.n+'!');return;}
  await msg(M.n+' wirklich nicht lernen?');if(!await yesNo())continue;await msg(n+' lernt '+M.n+' nicht.');return;}}

function lockGame(){return new Promise(res=>{let round=0,p=0,dir=1,c=.3+Math.random()*.4,flash=0,done=false;const W2=[.24,.16,.1],SP2=[.012,.017,.022];
 const u={key(b){if(done)return;if(b==='a'){const w=W2[round];if(Math.abs(p-c)<=w/2){sfx('ok');round++;flash=12;if(round>=3){done=true;setTimeout(()=>{rm(u);res(true);},450);}else c=.15+Math.random()*.7;}
   else{sfx('bump');done=true;flash=-12;setTimeout(()=>{rm(u);res(false);},500);}}},
  update(){if(done)return;p+=dir*SP2[Math.min(round,2)];if(p>1){p=1;dir=-1;}if(p<0){p=0;dir=1;}if(flash>0)flash--;if(flash<0)flash++;},
  draw(){box(10,30,140,70);textC('SCHLOSS KNACKEN',80,35,INK,7);textC('Runde '+Math.min(3,round+1)+'/3',80,46,SUB,6);
   const bx=22,bw=116,by=60;rr(bx,by,bw,10,3,'#3a3040');const w=W2[Math.min(round,2)];rr(bx+bw*(c-w/2),by+1,bw*w,8,2,flash>0?'#9af07a':'#4ac05a');
   const px2=bx+bw*p;ctx.fillStyle=flash<0?'#e8483a':'#ffd23f';ctx.beginPath();ctx.moveTo(px2,by-1);ctx.lineTo(px2-3,by-6);ctx.lineTo(px2+3,by-6);ctx.closePath();ctx.fill();ctx.fillRect(px2-.6,by,1.2,10);
   for(let i=0;i<3;i++)ellipse(ctx,i<round?'#ffd23f':'#d8d0c0',68+i*12,82,3.4,3.4);textC('A drücken!',80,90,SUB,5.6);}};ui.push(u);});}

function simonGame(){return new Promise(res=>{const D=['up','right','down','left'],len=4+Math.min(2,Math.floor(badgeCount()/2)),seq=Array.from({length:len},()=>pick(D));
 let phase='show',t=0,i=0,lit=null,done=false;
 const u={key(b){if(phase!=='input'||done||!D.includes(b))return;lit=b;t=0;if(b===seq[i]){sfx('blip');i++;if(i>=seq.length){done=true;sfx('ok');setTimeout(()=>{rm(u);res(true);},500);}}else{done=true;sfx('bump');lit='x';setTimeout(()=>{rm(u);res(false);},600);}},
  update(){t++;if(phase==='show'){const k=Math.floor(t/34),f=t%34;lit=k<seq.length&&f<24?seq[k]:null;if(k>=seq.length+1){phase='input';lit=null;t=0;}}else if(lit&&lit!=='x'&&t>12)lit=null;},
  draw(){box(20,18,120,96);textC('MERKSPIEL',80,23,INK,7);textC(phase==='show'?'Gut aufpassen...':'Jetzt du! ('+i+'/'+seq.length+')',80,33,SUB,6);
   const P={up:[80,52],down:[80,92],left:[58,72],right:[102,72]},C={up:'#e8483a',right:'#3a8ad8',down:'#4ac05a',left:'#e8b830'};
   for(const d of D){const[x,y]=P[d],on=lit===d;rr(x-9,y-9,18,18,4,on?shade(C[d],1.35):shade(C[d],.7));if(on){ctx.globalAlpha=.4;ellipse(ctx,'#ffffff',x,y,12,12);ctx.globalAlpha=1;}
    ctx.save();ctx.translate(x,y);ctx.rotate({up:0,right:Math.PI/2,down:Math.PI,left:-Math.PI/2}[d]);ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(5,3);ctx.lineTo(-5,3);ctx.closePath();ctx.fill();ctx.restore();}
   if(lit==='x')textC('FALSCH!',80,69,'#c0302a',7);}};ui.push(u);});}

function cupGame(){return new Promise(res=>{const swaps=6+Math.min(4,badgeCount()),pos=[0,1,2];let key=rnd(0,2),phase='show',t=0,sw=null,n=0,sel=1,done=false,reveal=false;
 const speed=()=>Math.max(10,22-badgeCount()*2);
 const u={key(b){if(phase!=='pick'||done)return;if(b==='left')sel=(sel+2)%3;else if(b==='right')sel=(sel+1)%3;else if(b==='a'){done=true;reveal=true;const cupAtSel=pos.findIndex(p=>p===sel);const ok=cupAtSel===key;sfx(ok?'ok':'bump');u.ok=ok;setTimeout(()=>{rm(u);res(ok);},900);}else return;if(!done)sfx('blip');},
  update(){t++;if(phase==='show'&&t>70){phase='lift';t=0;}else if(phase==='lift'&&t>16){phase='swap';t=0;}
   else if(phase==='swap'){if(!sw){const a=rnd(0,2);let b=rnd(0,1);if(b>=a)b++;sw={a,b,t:0};}sw.t++;if(sw.t>=speed()){const ia=pos.indexOf(sw.a),ib=pos.indexOf(sw.b);[pos[ia],pos[ib]]=[pos[ib],pos[ia]];sw=null;n++;if(n>=swaps){phase='pick';}}}},
  draw(){box(6,24,148,84);textC('HÜTCHENSPIEL',80,29,INK,7);textC(phase==='pick'&&!done?'Wähle mit ◀ ▶ und A':phase==='swap'?'Gut hinschauen...':done?(u.ok?'Gefunden!':'Daneben!'):'Hier liegt der Schlüssel!',80,39,done&&!u.ok?'#c0302a':SUB,6);
   const slotX=s=>40+s*40;
   for(let c=0;c<3;c++){let x=slotX(pos[c]),y=86;
    if(sw&&(sw.a===pos[c]||sw.b===pos[c])){const q=sw.t/speed(),other=sw.a===pos[c]?sw.b:sw.a;x=slotX(pos[c])+(slotX(other)-slotX(pos[c]))*q;y=86+(sw.a===pos[c]?-1:1)*Math.sin(q*Math.PI)*8;}
    const lifted=(phase==='show'&&t>20)||(reveal&&(c===key||pos[c]===sel));
    if(c===key&&(lifted)){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(x,y-2,2.4,0,TAU);ctx.fill();ctx.fillRect(x+1.4,y-2.6,6,1.4);ctx.fillRect(x+5,y-2.6,1.2,3);ctx.lineWidth=.4;ctx.strokeStyle='#5a3a10';ctx.stroke();}
    const ly=lifted?y-14:y;ctx.save();ctx.beginPath();ctx.moveTo(x-9,ly);ctx.lineTo(x-6,ly-16);ctx.quadraticCurveTo(x,ly-19,x+6,ly-16);ctx.lineTo(x+9,ly);ctx.closePath();
    ctx.fillStyle=lgrad(ctx,x-9,0,x+9,0,[[0,'#7a4a2a'],[.4,'#c8884a'],[1,'#6a3a1a']]);ctx.fill();ctx.lineWidth=.6;ctx.strokeStyle='#2a1a10';ctx.stroke();ctx.restore();
    if(phase==='pick'&&!done&&pos[c]===sel)arrowD(x-3.5,ly-27+((frame>>3)&1),R.frame);}
  }};ui.push(u);});}

function qCount(sp){return[...G.team,...G.box].filter(m=>m.sp===sp).length;}
function newQuest(){const pools=[];for(const id in MAPS){const e=MAPS[id].enc;if(e&&G.vm&&G.vm[id]&&!MAPS[id].cave)for(const p of e.pool)if(SP[p[0]].rate>=.3)pools.push(p[0]);}
 if(!pools.length)pools.push('zirpmaus','sturmspatz','pilzwicht');
 const types=['catch','wins','deliver'];if(G.inv.angel)types.push('fish');const t=pick(types),b=badgeCount(),money=300+b*250+rnd(0,4)*50;
 const rw=pick(['superball','superpotion','beere','revive','ether']);
 if(t==='catch'){const sp=pick(pools);return{type:t,sp,base:qCount(sp),money,rw};}
 if(t==='wins'){const n=rnd(3,5);return{type:t,n,base:ST().wins,money:money+n*80,rw};}
 if(t==='fish'){return{type:t,n:3,base:ST().fish,money,rw};}

function qProg(q){if(q.type==='catch')return[Math.min(1,qCount(q.sp)-q.base),1];if(q.type==='wins')return[Math.min(q.n,ST().wins-q.base),q.n];if(q.type==='fish')return[Math.min(q.n,ST().fish-q.base),q.n];return[Math.min(q.n,G.inv[q.k]||0),q.n];}

function placeMoss(){let seed=20261018;const rng=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
 const fixed=[['felsenau',1,2],['bluetenhain',18,2],['route2',27,4],['wolkendorf',2,3],['route6',0,4]];
 const maps=['route1','lindhof','route2','felsenau','klippenhoehle','moosgrotte','seebruck','route3','funkenfeld','route4','spukwald','heckenlabyrinth','bluetenhain','route5','kristallhoehle','vulkanpass','glutberg','route6','frostgipfel','insel','bauernhof','wolkenpfad','pclgelaende','route1','route3','route4','route5','route2','route6','wolkenpfad'];
 const taken=new Set();const add=(m,x,y)=>{const k=m+':'+x+','+y;if(taken.has(k))return false;taken.add(k);MOSS.push({k,m,x,y});return true;};
 for(const[m,x,y]of fixed)add(m,x,y);
 const BL=BLOCK+'OU';
 for(const id of maps){if(MOSS.length>=30)break;const M=MAPS[id];if(!M)continue;
  const occ=new Set(M.npcs.map(n=>n.x+','+n.y));Object.keys(M.signs||{}).forEach(k=>occ.add(k));Object.keys(M.warps||{}).forEach(k=>occ.add(k));Object.keys(M.hidden||{}).forEach(k=>occ.add(k));
  const seen=new Set(),q=[];for(let y=0;y<M.h;y++)for(let x=0;x<M.w;x++){const t=M.rows[y][x];if(t==='P'||t==='E'){seen.add(x+','+y);q.push([x,y]);}}
  while(q.length){const[x,y]=q.shift();for(const[dx,dy]of Object.values(DIRS)){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(nx<0||ny<0||nx>=M.w||ny>=M.h||seen.has(k))continue;const t=M.rows[ny][nx];if(BL.includes(t)||'CAMLHG'.includes(t))continue;seen.add(k);q.push([nx,ny]);}}
  const cand=[...seen].filter(k=>{const[x,y]=k.split(',').map(Number),t=M.rows[y][x];return '.,'.includes(t)&&!occ.has(k)&&x>0&&y>0&&x<M.w-1&&y<M.h-1&&Math.abs(x-M.w/2)+Math.abs(y-M.h/2)>3;});
  for(let tries=0;tries<20&&cand.length;tries++){const k=cand[Math.floor(rng()*cand.length)];const[x,y]=k.split(',').map(Number);if(add(id,x,y))break;}}
}

 if(wx==='snow'&&frame%2===0)WXP.push({x:Math.random()*(W+20),y:-3,vx:-.3,vy:.5+Math.random()*.4,l:320,k:'s',w:Math.random()*6});
 for(let i=WXP.length-1;i>=0;i--){const p=WXP[i];p.x+=p.vx+(p.k==='s'?Math.sin((frame+p.w*20)*.05)*.3:0);p.y+=p.vy;if(--p.l<=0||p.y>H+4){WXP.splice(i,1);continue;}
  if(p.k==='r'){ctx.globalAlpha=.55;px(ctx,'#cfe6ff',Math.round(p.x),Math.round(p.y),1,3);ctx.globalAlpha=1;if(p.y>H-6&&Math.random()<.1)addP({x:p.x,y:p.y,life:6,col:'#e0f0ff',s:1},AMB);}
  else px(ctx,'#ffffff',Math.round(p.x),Math.round(p.y),p.w>4?2:1,p.w>4?2:1);}
 if(wx!=='rain'&&wx!=='snow')WXP.length=0;
 if(wx==='fog'||MAPC.reg==='spuk'){ctx.globalAlpha=MAPC.reg==='spuk'?.14:.12;for(let i=0;i<4;i++){const x=((frame*.15+i*70)%(W+120))-60;ellipse(ctx,MAPC.reg==='spuk'?'#c8b8e8':'#ffffff',Math.round(x),20+i*34,50,12);}ctx.globalAlpha=1;}
}
function drawMon(k,flip,x,y,scale,sink,clip,shiny){
 if(scale<=0)return;ctx.save();ctx.beginPath();ctx.rect(clip[0],clip[1],clip[2],clip[3]);ctx.clip();
 const s=48*scale;ctx.drawImage(scale<1?monSilHi(k):monHi(k,flip,shiny),x+24-s/2,y+48-s+sink,s,s);ctx.restore();}
function drawBattle(){
 ctx.save();if(BFX.zoom!==1){ctx.translate(BFX.zx,BFX.zy);ctx.scale(BFX.zoom,BFX.zoom);ctx.translate(-BFX.zx,-BFX.zy);}
 ctx.drawImage(bgCanvas(),0,0,160,96);
 const outdoor=MAPC.arenaIdx==null&&!INDOOR.has(MAPC.id);
 if(outdoor){if(REGK==='ember'){ctx.globalAlpha=.5;for(let i=0;i<3;i++){const x=((frame*.08+i*60)%200)-20;ellipse(ctx,'#5a4444',Math.round(x),10+i*8,10,3);}ctx.globalAlpha=1;}
  else{const x1=((frame*.06)%220)-30,x2=((frame*.04+110)%220)-30;cloud(ctx,Math.round(x1),12,1);cloud(ctx,Math.round(x2),26,1);}}
 const ph=outdoor?dayPhase():'tag';if(ph!=='tag'){if(ph==='nacht'){ctx.globalAlpha=.45;px(ctx,'#101a4a',0,0,160,96);ctx.globalAlpha=1;for(let i=0;i<26;i++){const x=hash(i,5)%160,y=hash(i,9)%40,tw=((frame+i*17)>>5)&1;px(ctx,tw?'#ffffff':'#a8b8ff',x,y,1,1);}ellipse(ctx,'#f4f0d8',30,14,6,6);ellipse(ctx,'#101a4a',33,12,5,5);}else{ctx.globalAlpha=.18;px(ctx,'#ff7a2a',0,0,160,96);ctx.globalAlpha=.1;px(ctx,'#6a2a7a',0,0,160,60);ctx.globalAlpha=1;}}
 const sl=B.slide*120;
 if(B.double){platform(122+sl,48,42,7);platform(40-sl,92,46,8);}else{platform(128+sl,48,32,7);platform(38-sl,91,38,8);}
 if(BFX.dark>0){ctx.globalAlpha=BFX.dark;px(ctx,'#0a0618',-40,-40,240,180);ctx.globalAlpha=1;}
 const all=[...B.en,...B.me];
 all.forEach(w=>{if(!w.show||!w.mon)return;const p=posOf(w),dx=w.side==='en'?sl:-sl;ctx.globalAlpha=.3;ellipse(ctx,'#000000',Math.round(p.x+dx+w.nudge),p.y+22,Math.round(16*w.scale),3);ctx.globalAlpha=1;});
 B.en.forEach((w,i)=>{if(!B.trainer||w.show||B.everOut)return;const p=posOf(w);const tv=B.trainer.v==='twin'?(i?'twinB':'twinA'):(B.trainer.v||2);ctx.drawImage(personAt(tv,'down',0,48),p.x-24+sl,p.y-26,48,48);});
 B.en.forEach(w=>{if(!w.show||!w.mon||w.flash||(B.ball&&w===B.en[0]&&!w.show))return;const p=posOf(w),br=(Math.sin(frame*.07+w.idx*2)>.3)?1:0;
  if(w.kb>0)w.kb=Math.max(0,w.kb-.5);
  drawMon(w.mon.sp,false,p.x-24+sl+w.nudge+w.shake+w.kb,p.y-24+br+w.jump,w.scale,w.sink,B.double?[60,0,100,50]:[92,0,68,50],w.mon.shiny);if(w.mon.shiny&&w.scale>=1&&frame%9===0)addP({k:'star',x:p.x+sl+(Math.random()-.5)*36,y:p.y-4+(Math.random()-.5)*30,vy:-.15,life:26,s:1.6,col:pick(['#fff6b0','#ffffff','#ffd23f']),rot:Math.random()});});
 B.me.forEach(w=>{if(!w.show||!w.mon||w.flash)return;const p=posOf(w),br=(Math.sin(frame*.07+2+w.idx*2)>.3)?1:0;
  if(w.kb>0)w.kb=Math.max(0,w.kb-.5);
  drawMon(w.mon.sp,true,p.x-24-sl+w.nudge+w.shake-w.kb,p.y-24+br+w.jump,w.scale,w.sink,[0,40,100,53],w.mon.shiny);if(w.mon.shiny&&w.scale>=1&&frame%9===0)addP({k:'star',x:p.x-sl+(Math.random()-.5)*36,y:p.y-4+(Math.random()-.5)*30,vy:-.15,life:26,s:1.6,col:pick(['#fff6b0','#ffffff','#ffd23f']),rot:Math.random()});});
 if(!B.everOut&&!B.me.some(w=>w.show))ctx.drawImage(personAt(PLV(),'up',0,48),14-sl,44,48,48);
 if(B.me.some(w=>w.show&&w.scale>=1))B.everOut=true;
 if(B.ball){const x=B.ball.x+B.ball.w,y=B.ball.y,landed=!B.en[0].show;ctx.save();ctx.translate(x,y+.5);ctx.rotate(B.ball.w*.12+(B.ball.r||0));netDraw(0,0,landed?5.2:3.6,NETCOL[B.ball.k]||'#4aa05a',false,landed);ctx.restore();}
 if(B.weather==='rain'||B.weather==='storm'){ctx.globalAlpha=.5;for(let i=0;i<30;i++){const x=(hash(i,3)%180+frame*1.5*(1+i%3))%180-10,y=(hash(i,7)%96+frame*5*(1+i%2))%96;px(ctx,'#cfe6ff',Math.round(160-x),Math.round(y),1,3);}ctx.globalAlpha=1;}
 if(B.weather==='snow'){for(let i=0;i<24;i++){const x=(hash(i,3)%160+Math.sin(frame*.03+i)*6+160)%160,y=(hash(i,7)%96+frame*.6*(1+i%3))%96;px(ctx,'#ffffff',Math.round(x),Math.round(y),i%4?1:2,i%4?1:2);}}
 drawP(FX);ctx.restore();drawBFX();vignette();
 POP.forEach(p=>{const yy=p.y-Math.min(14,p.t*.6),sz=p.big?8:7;ctx.globalAlpha=p.t>40?(55-p.t)/15:1;textO(p.txt,p.x-textW(p.txt,sz)/2,Math.round(yy),p.col,'#1e1a2a',sz);ctx.globalAlpha=1;});
 if(B.slide>0||B.cine)return;
 if(!B.double){
  const e=B.en[0];if(e.show||e.sink>0||B.ball){const m=e.mon,s=stats(m);box(2,3,94,32);text(mName(m),9,8,INK,7);if(m.shiny)star(86,8.5);text('Lv'+m.lvl,9,16.2,SUB,6.5);statusChip(m,40,15.6);if(e.conf)text('?',80,16.2,'#8a5ad8',7);
   if(!B.trainer&&G.caught[m.sp])ballIcon(84,16.2);text('KP',9,24.6,'#d0802a',6,700);hpBar(23,25.4,66,e.disp/s.hp);}
  if(B.trainer)B.foes.forEach((f,i)=>ballIcon(6+i*8,37,f.hp<=0));
  const w=B.me[0];if(w.show){const m=w.mon,s=stats(m);box(64,55,94,40);text(mName(m),71,59.5,INK,7);if(m.shiny)star(148,60);text('Lv'+m.lvl,71,68.5,SUB,7);statusChip(m,102,68);
   const hs=Math.ceil(w.disp)+'/'+s.hp;textR(hs,152,70,INK,6);
   text('KP',71,77,'#d0802a',6,700);hpBar(85,77.6,67,w.disp/s.hp);
   let xr;if(B.xpAnim&&B.xpAnim.m===m){const v=B.xpAnim.from+(B.xpAnim.to-B.xpAnim.from)*B.xpAnim.p;xr=(Math.min(v,xpFor(m.lvl+1))-xpFor(m.lvl))/(xpFor(m.lvl+1)-xpFor(m.lvl));}else xr=(m.xp-xpFor(m.lvl))/(xpFor(m.lvl+1)-xpFor(m.lvl));
   text('EP',71,84.5,'#3a8ef0',6,700);rr(85,85.6,67,3.4,1.7,'#2a2f3a');rr(86,86.4,65,1.8,.9,'#dfe6f0');rr(86,86.4,Math.max(1.4,65*Math.max(0,Math.min(1,xr))),1.8,.9,'#3a8ef0');}
 }else{
  B.en.forEach((w,i)=>{if(!w.mon||(!w.show&&w.sink===0&&w.mon.hp<=0))return;const m=w.mon,s=stats(m),y=2+i*18;box(2,y,80,17);text(mName(m),7,y+3,INK,6);text('Lv'+m.lvl,58,y+3,SUB,6);hpBar(7,y+10.4,58,w.disp/s.hp);const st=statusTag(m);if(st&&m.hp>0)text(st,67,y+10,'#c0402a',5);});
  B.foes.forEach((f,i)=>ballIcon(4+i*8,39,f.hp<=0));
  B.me.forEach((w,i)=>{if(!w.mon||(!w.show&&w.mon.hp<=0))return;const m=w.mon,s=stats(m),y=54+i*21;box(78,y,80,20);text(mName(m),83,y+3.6,INK,6);const hs=Math.ceil(w.disp)+'/'+s.hp;textR(hs,153,y+4,SUB,5);hpBar(83,y+12,52,w.disp/s.hp);text('L'+m.lvl,138,y+11,SUB,5);});
 }
}
function drawEvo(){vgrad(ctx,0,0,W,96,'#1e1a40','#5a4a8a',2);px(ctx,'#2e2858',0,96,W,48);
 for(let i=0;i<12;i++){const a=frame*.02+i*Math.PI/6;px(ctx,'#7a6ac0',80+Math.cos(a)*62,52+Math.sin(a)*38,2,2);}
 ctx.globalAlpha=.35;ellipse(ctx,'#b8a8ff',80,52,40,36);ctx.globalAlpha=1;
 ellipse(ctx,'#6a5aa8',80,80,30,5);drawP(FX);
 ctx.drawImage(EV.sil?monSilHi(EV.show):monHi(EV.show,false,EV.shiny),56,28,48,48);vignette();}
function drawCredits(){vgrad(ctx,0,0,W,H,'#1e2a5a','#6a5aa8',2);
 for(let i=0;i<24;i++){const x=(i*37+frame*.3)%W,y=(i*53)%100,tw=((frame+i*13)>>4)&1;px(ctx,tw?'#ffffff':'#b8c8ff',x,y,1,1);}
 textO('CHAMPION!',40,10,'#ffd23f','#1e1a40',8);text(G.champion?'Ruhmeshalle':'Wildling-Meister',G.champion?36:24,22,'#ffffff',7);
 LEADERS.forEach((L,i)=>drawBadge(i,6+(i%10)*15,30+Math.floor(i/10)*15,!!G.badges[i],1.1));
 G.team.forEach((m,i)=>{const b=Math.abs(Math.sin(frame*.1+i))*3;ctx.drawImage(monAt(m.sp,24,false,m.shiny),8+(i%6)*25,64-b,24,24);text('L'+m.lvl,10+(i%6)*25,90,'#d8d0ff',5);});
 text('Danke fürs Spielen!',4,106,'#ffffff',8);if((frame>>5)&1)text('A: weiter',44,124,'#ffe070',7);}

function render(){
 ctx.setTransform(S,0,0,S,0,0);
 if(shake>0){const ox=Math.round((Math.random()-.5)*shake),oy=Math.round((Math.random()-.5)*shake);ctx.setTransform(S,0,0,S,ox*S,oy*S);}
 if(scene==='title'){setReg('meadow');drawTitle();vignette();}else if(scene==='intro')drawIntro();else if(scene==='starter')drawStarter();
 else if(scene==='world')drawWorld();else if(scene==='battle'&&B)drawBattle();else if(scene==='evo'&&EV)drawEvo();else if(scene==='credits')drawCredits();else paperBG();
 ctx.setTransform(S,0,0,S,0,0);
 postFX();
 ui.forEach(u=>u.draw());
 if(wipe>0)drawWipe();
 if(fade>0){ctx.globalAlpha=Math.min(1,fade);px(ctx,INK,0,0,W,H);ctx.globalAlpha=1;}
 if(flashA>0&&flashCol){ctx.globalAlpha=Math.min(1,flashA);px(ctx,flashCol,0,0,W,H);ctx.globalAlpha=1;}
}
function step(){
 frame++;if(scene==='world'||scene==='battle'||scene==='evo')G.time=(G.time||0)+1/60;if(importQueue&&frame%15===0)tryImport();
 for(const t of tasks.slice()){t.i++;t.fn(Math.min(1,t.i/t.n));if(t.i>=t.n){tasks.splice(tasks.indexOf(t),1);t.r();}}
 ui.forEach(u=>u.update&&u.update());
 stepP(FX);stepP(WFX);stepP(AMB);for(let i=POP.length-1;i>=0;i--)if(++POP[i].t>55)POP.splice(i,1);if(shake>0)shake=Math.max(0,shake-.5);
 if(banner&&banner.n>0&&!ui.length)banner.n--;
 if(scene==='world')updateWorld();
}
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.667){step();acc-=16.667;}render();requestAnimationFrame(loop);}

/* ================= EINGABE ================= */
function press(b){
 initAudio();
 if(b==='select'){toggleSound();return;}
 if(ui.length){ui[ui.length-1].key(b);return;}
 if(busy)return;
 if(scene==='title'&&(b==='a'||b==='start'))titleStart();
 else if(scene==='world'&&!pl.moving){if(b==='a')interact();else if(b==='start')startMenu();}
}
const DIRSET=new Set(['up','down','left','right']);
const addDir=d=>{if(!dirStack.includes(d))dirStack.push(d);};
const remDir=d=>{const i=dirStack.indexOf(d);if(i>=0)dirStack.splice(i,1);};
const KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right',z:'a',Z:'a',j:'a',' ':'a',x:'b',X:'b',k:'b',Backspace:'b',Escape:'b',Enter:'start',m:'select',M:'select'};
addEventListener('keydown',e=>{const tg=e.target&&e.target.tagName;if(tg==='TEXTAREA'||tg==='INPUT'||tg==='BUTTON')return;const b=KM[e.key];if(!b)return;e.preventDefault();
 if(b==='b')heldB=true;if(b==='a')heldA=true;
 if(DIRSET.has(b)){addDir(b);press(b);}else if(!e.repeat)press(b);});
addEventListener('keyup',e=>{const tg=e.target&&e.target.tagName;if(tg==='TEXTAREA'||tg==='INPUT')return;const b=KM[e.key];if(!b)return;if(DIRSET.has(b))remDir(b);if(b==='b')heldB=false;if(b==='a')heldA=false;});
addEventListener('blur',()=>{dirStack.length=0;heldB=heldA=false;});
/* ---- Controller (Gamepad) ---- */
{const PADMAP={0:'a',1:'b',2:'b',3:'a',8:'select',9:'start',12:'up',13:'down',14:'left',15:'right'};let prev={},rep={};
 const down=b=>{initAudio();if(b==='b')heldB=true;if(b==='a')heldA=true;if(DIRSET.has(b)){addDir(b);press(b);}else press(b);},up=b=>{if(DIRSET.has(b))remDir(b);if(b==='b')heldB=false;if(b==='a')heldA=false;};
 function poll(){try{const pads=navigator.getGamepads?navigator.getGamepads():[];const now={};
  for(const p of pads){if(!p)continue;p.buttons.forEach((bt,i)=>{const b=PADMAP[i];if(b&&(bt.pressed||bt.value>.5))now[b]=1;});
   const ax=p.axes[0]||0,ay=p.axes[1]||0;if(ax<-.5)now.left=1;if(ax>.5)now.right=1;if(ay<-.5)now.up=1;if(ay>.5)now.down=1;}
  for(const b in now){if(!prev[b]){down(b);rep[b]=performance.now()+350;}else if(DIRSET.has(b)&&ui.length&&performance.now()>rep[b]){press(b);rep[b]=performance.now()+110;}}
  for(const b in prev)if(!now[b])up(b);prev=now;}catch(e){}requestAnimationFrame(poll);}
 requestAnimationFrame(poll);}
document.querySelectorAll('[data-btn]').forEach(el=>{
 const b=el.dataset.btn;let rep=null,del=null;
 el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(_){}
  if(b==='b')heldB=true;if(b==='a')heldA=true;
  if(DIRSET.has(b)){addDir(b);press(b);del=setTimeout(()=>{rep=setInterval(()=>press(b),110);},350);}else press(b);});
 const up=()=>{el.classList.remove('on');if(DIRSET.has(b))remDir(b);if(b==='b')heldB=false;if(b==='a')heldA=false;clearTimeout(del);clearInterval(rep);};
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,up));
 el.addEventListener('contextmenu',e=>e.preventDefault());
});

initSlots();
{const $=id=>document.getElementById(id);
 $('btnExport').onclick=async()=>{if(G.team.length)save();const r=await exportFile();setSaveMsg(r||'Datei-Speichern ist hier nicht verfügbar. Nutze den Code.');};
 $('btnImport').onclick=()=>{const f=$('fileIn');f.value='';f.click();};
 $('fileIn').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>offerImport(decodeSave(String(rd.result)));rd.onerror=()=>setSaveMsg('Die Datei konnte nicht gelesen werden.');rd.readAsText(f);};
 $('btnCopy').onclick=async()=>{if(G.team.length)save();const d=G.team.length?snapshotSave():slots[curSlot];if(!d){setSaveMsg('Es gibt noch keinen Spielstand.');return;}
  const code=encodeSave(d),tb=$('codeBox');tb.hidden=false;tb.value=code;$('btnCodeLoad').hidden=true;
  try{await navigator.clipboard.writeText(code);setSaveMsg('Code kopiert. Auf einem anderen Gerät unter „Code einfügen“ einsetzen.');}catch(e){tb.focus();tb.select();setSaveMsg('Code ist markiert. Jetzt kopieren.');}};
 $('btnPaste').onclick=()=>{const tb=$('codeBox');tb.hidden=false;tb.value='';tb.placeholder='Spielstand-Code hier einfügen';$('btnCodeLoad').hidden=false;tb.focus();setSaveMsg('');};
 $('btnCodeLoad').onclick=()=>offerImport(decodeSave($('codeBox').value));}
cv.addEventListener('pointerdown',e=>{initAudio();const r=cv.getBoundingClientRect();const gx=(e.clientX-r.left)/r.width*W,gy=(e.clientY-r.top)/r.height*H;
 if(ui.length){const u=ui[ui.length-1];if(u.isMsg){press('a');return;}return;}
 if(scene==='title'){press('a');return;}tapAt(gx,gy);});
try{document.fonts.load('600 10px Fredoka');document.fonts.load('700 10px Fredoka');}catch(e){}
playSong('town');
let started=false;const begin=()=>{if(!started){started=true;requestAnimationFrame(t=>{last=t;loop(t);});}};
if(document.fonts&&document.fonts.load){document.fonts.load("8px 'Press Start 2P'").then(begin,begin);setTimeout(begin,1500);}else begin();
})();
</script>
